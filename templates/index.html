<!DOCTYPE html>
<html>
  <head>
    <title>Heart Disease Prediction</title>

    <style>
      body {
        font-family: Arial;
        background-color: #f2f2f2;
        text-align: center;
      }

      .container {
        background: white;
        padding: 20px;
        width: 50%;
        margin: auto;
        margin-top: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
      }

      input {
        width: 80%;
        padding: 8px;
        margin: 5px;
      }

      button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 10px;
      }

      button:hover {
        background-color: #218838;
      }

      .result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: blue;
      }

      table {
        margin: auto;
        border-collapse: collapse;
        width: 80%;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
      }

      th {
        background-color: #28a745;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Heart Disease Prediction</h2>

      <form action="/predict" method="post">
        <input type="text" name="age" placeholder="Age" required /><br />
        <input
          type="text"
          name="sex"
          placeholder="Sex (1 = male, 0 = female)"
          required
        /><br />
        <input
          type="text"
          name="cp"
          placeholder="Chest Pain Type"
          required
        /><br />
        <input
          type="text"
          name="trestbps"
          placeholder="Resting BP"
          required
        /><br />
        <input
          type="text"
          name="chol"
          placeholder="Cholesterol"
          required
        /><br />
        <input
          type="text"
          name="fbs"
          placeholder="Fasting Blood Sugar"
          required
        /><br />
        <input
          type="text"
          name="restecg"
          placeholder="Rest ECG"
          required
        /><br />
        <input
          type="text"
          name="thalach"
          placeholder="Max Heart Rate"
          required
        /><br />
        <input
          type="text"
          name="exang"
          placeholder="Exercise Angina"
          required
        /><br />
        <input
          type="text"
          name="oldpeak"
          placeholder="Oldpeak"
          required
        /><br />
        <input type="text" name="slope" placeholder="Slope" required /><br />
        <input type="text" name="ca" placeholder="CA" required /><br />
        <input type="text" name="thal" placeholder="Thal" required /><br />

        <button type="submit">Predict</button>
      </form>

      <div class="result">{{ prediction_text }}</div>

      {% if shap_table %}
      <h3>Feature Contribution (SHAP)</h3>

      <table>
        <tr>
          <th>Feature</th>
          <th>Value</th>
          <th>Impact (SHAP)</th>
        </tr>

        {% for row in shap_table %}
        <tr>
          <td>{{ row.feature }}</td>
          <td>{{ row.value }}</td>
          <td>{{ row.shap_value }}</td>
        </tr>
        {% endfor %}
      </table>
      {% endif %}
    </div>
  </body>
</html>
