<!DOCTYPE html>
<html>
  <head>
    <title>Heart Disease Prediction</title>
    <style>
      body {
        font-family: Arial;
        background-color: #f2f2f2;
        text-align: center;
      }

      .container {
        background: white;
        padding: 20px;
        width: 50%;
        margin: auto;
        margin-top: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
      }

      input {
        width: 80%;
        padding: 8px;
        margin: 5px;
      }

      button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 10px;
      }

      button:hover {
        background-color: #218838;
      }

      .result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: blue;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Heart Disease Prediction</h2>

      <form action="/predict" method="post">
        <input type="text" name="age" placeholder="Age" required /><br />
        <input
          type="text"
          name="sex"
          placeholder="Sex (1 = male, 0 = female)"
          required
        /><br />
        <input
          type="text"
          name="cp"
          placeholder="Chest Pain Type (cp)"
          required
        /><br />
        <input
          type="text"
          name="trestbps"
          placeholder="Resting Blood Pressure"
          required
        /><br />
        <input
          type="text"
          name="chol"
          placeholder="Cholesterol"
          required
        /><br />
        <input
          type="text"
          name="fbs"
          placeholder="Fasting Blood Sugar"
          required
        /><br />
        <input
          type="text"
          name="restecg"
          placeholder="Resting ECG"
          required
        /><br />
        <input
          type="text"
          name="thalach"
          placeholder="Max Heart Rate (thalach)"
          required
        /><br />
        <input
          type="text"
          name="exang"
          placeholder="Exercise Induced Angina"
          required
        /><br />
        <input
          type="text"
          name="oldpeak"
          placeholder="Oldpeak"
          required
        /><br />
        <input type="text" name="slope" placeholder="Slope" required /><br />
        <input
          type="text"
          name="ca"
          placeholder="Number of major vessels (ca)"
          required
        /><br />
        <input type="text" name="thal" placeholder="Thal" required /><br />

        <button type="submit">Predict</button>
      </form>

      <div class="result">{{ prediction_text }}</div>
    </div>
  </body>
</html>
